<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertanyaan Penting 👑</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffd3e0 0%, #f9a8d4 100%);
            overflow: hidden; /* Penting supaya layar tidak bergeser saat tombol kabur */
        }

        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(219, 39, 119, 0.2);
            text-align: center;
            width: 90%;
            max-width: 420px;
            z-index: 10;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            color: #be185d;
            font-size: 22px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        p {
            color: #4b5563;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .highlight {
            color: #db2777;
            font-weight: 600;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
            min-height: 50px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-yes {
            background: #ec4899;
            color: white;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
        }

        .btn-yes:hover {
            background: #db2777;
            transform: scale(1.05);
        }

        .btn-no {
            background: #f3f4f6;
            color: #6b7280;
            position: relative; 
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <div class="icon">👑</div>
        <h1>Permisi...</h1>
        <p>Apakah boleh aku save kontak Princess dengan tambahan kata Princess di depannya menjadi <span class="highlight">"Princess Yulti Syududu🙂‍↕️"</span>?</p>
        
        <div class="buttons">
            <button class="btn-yes" id="btnYes">Boleh dong! 👍</button>
            <button class="btn-no" id="btnNo">Nggak Boleh 🙅‍♀️</button>
        </div>
    </div>

    <script>
        const noWa = "6282186657316";

        const btnNo = document.getElementById('btnNo');
        const btnYes = document.getElementById('btnYes');

        const moveButton = () => {
            const x = Math.random() * (window.innerWidth - btnNo.offsetWidth - 100) - (window.innerWidth / 4);
            const y = Math.random() * (window.innerHeight - btnNo.offsetHeight - 100) - (window.innerHeight / 4);
            
            btnNo.style.position = 'absolute';
            btnNo.style.transform = `translate(${x}px, ${y}px)`;
        };

        btnNo.addEventListener('mouseover', moveButton);
        
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            moveButton();
        });

        btnYes.addEventListener('click', () => {
            const pesan = encodeURIComponent("Boleh kok, gak apa apaa, sekaka jauh jauh sekaka jauh jauh");
            window.location.href = `https://wa.me/${noWa}?text=${pesan}`;
        });
    </script>
</body>
</html>
